spring:
  application:
    name: mbotamapay-backend
  jackson:
    serialization:
      write-dates-as-timestamps: false
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
    show-sql: ${HIBERNATE_SHOW_SQL:false}
  # Flyway Configuration
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:false}
    out-of-order: false
    placeholder-replacement: false
  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cache:
    type: redis
    redis:
      time-to-live: 300000 # 5 minutes
  # Email Configuration
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    default-encoding: UTF-8

server:
  port: ${SERVER_PORT:8080}

# Custom Properties
cinetpay:
  base-url: ${CINETPAY_BASE_URL:http://localhost:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION:900000} # 15 minutes
    refresh-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION:2592000000} # 30 days
  cinetpay:
    api-key: ${CINETPAY_API_KEY:placeholder_key}
    site-id: ${CINETPAY_SITE_ID:placeholder_site_id}
    username: ${CINETPAY_USERNAME:placeholder_user}
    password: ${CINETPAY_PASSWORD:placeholder_pass}
    base-url: ${CINETPAY_BASE_URL:https://api-checkout.cinetpay.com/v2/payment}
    notify-url: ${CINETPAY_NOTIFY_URL:placeholder_notify}
    return-url: ${CINETPAY_RETURN_URL:placeholder_return}
    webhook-secret: ${CINETPAY_WEBHOOK_SECRET:placeholder_secret}
  feexpay:
    api-key: ${FEEXPAY_API_KEY:placeholder_key}
    base-url: ${FEEXPAY_BASE_URL:https://api.feexpay.me}
    webhook-secret: ${FEEXPAY_WEBHOOK_SECRET:placeholder_secret}
  mail:
    from: ${MAIL_FROM:noreply@mbotamapay.com}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  metrics:
    export:
      prometheus:
        enabled: true
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

