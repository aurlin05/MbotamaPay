  redis:
    image: redis:7-alpine
    container_name: mbotamapay-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mbotamapay-network
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

networks:
  mbotamapay-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
